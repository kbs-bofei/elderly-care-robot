<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小暖 · 温暖相伴</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="16" cy="16" r="5" fill="currentColor" stroke="none"/>
          <path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.9 6.9 9 9M23 23l2.1 2.1M25.1 6.9 23 9M9 23l-2.1 2.1"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">小暖</div>
        <div class="brand-sub">温暖相伴每一天</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-nav="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        <span>陪伴对话</span>
      </button>
      <button class="nav-item" data-nav="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>回忆相册</span>
      </button>
      <button class="nav-item" data-nav="family">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span>家人联系</span>
      </button>
      <button class="nav-item" data-nav="health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>健康提醒</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="care-card">
        <div class="care-title">照护者视图</div>
        <div class="care-desc">查看长辈的对话与记忆</div>
      </div>
      <div class="status-row">
        <span class="status-dot"></span>
        <span id="status-line">正在连接…</span>
      </div>
      <label class="dev-switch" title="打开后可查看 AI 的工具调用过程，供开发者调试">
        <input type="checkbox" id="dev-toggle">
        <span>开发者模式</span>
      </label>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="view-title">陪伴对话</h1>
        <p id="view-sub">有什么想聊的，随时跟我说</p>
      </div>
      <button id="clear-btn" class="ghost-btn" title="清空对话">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
        重新开始
      </button>
    </header>

    <section class="chat" id="messages">
      <div class="msg ai">
        <div class="ai-ava"><svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="5" fill="currentColor" stroke="none"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.9 6.9 9 9M23 23l2.1 2.1M25.1 6.9 23 9M9 23l-2.1 2.1"/></svg></div>
        <div class="msg-col">
          <div class="bubble">您好呀，我是小暖。今天想聊点什么呢？</div>
          <div class="bubble-time">刚刚</div>
        </div>
      </div>
    </section>

    <section class="gallery" id="gallery" hidden>
      <div class="gallery-intro">这里存着从前的老照片，点开看看，想起什么就跟我说。</div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <footer class="composer" id="composer">
      <div class="quick-label">您也许想说</div>
      <div class="quick" id="quick">
        <button data-q="我想看小雨小时候的照片">看老照片</button>
        <button data-q="我想听段戏">想听段戏</button>
        <button data-q="陪我说说话">陪我聊聊</button>
      </div>
      <form id="form">
        <input id="input" type="text" autocomplete="off" placeholder="跟小暖说句话…" disabled>
        <button id="send" type="submit" disabled>
          发送
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <p class="hint" id="hint"></p>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="回忆照片">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
